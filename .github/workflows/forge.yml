name: Forge

# The Forge jobs: the real-Forge e2e and the jar-gated vitest suites, on every
# push to main and every PR, beside `ci.yml`'s `check`. Since 2026-10-07 they
# gate NOTHING: `redeploy.yml` deploys on `check` alone, and a red here is a
# work item for whoever landed it (the operator: "look at the tests and fix
# them later"). Everything below moved here verbatim from `ci.yml`.
#
# `push: main` is covered because this repo's normal path is landing straight
# on main rather than opening a PR.
on:
  pull_request:
  push:
    branches: [main]
  # Targeted verification inputs (wave forge-claws, phase 2): a manual
  # dispatch can narrow what runs instead of the full derived/pinned set, so
  # an agent session can prove a fix on the claws in ~minutes instead of
  # running the whole suite on hokon. Every input defaults to '' (or `both`
  # for `only`), which is EXACTLY today's behaviour — a push, a PR and the
  # nightly schedule never carry `inputs` at all, so every `${{ inputs.* }}`
  # expression below reads as the empty string/default on those triggers,
  # identical to before this block existed.
  workflow_dispatch:
    inputs:
      specs:
        description: >-
          forge-e2e only: extra args appended to `playwright test`, e.g.
          `table-fit -g "a live match fits"`. Empty = today's derived
          Forge-gated spec list.
        required: false
        default: ''
      jvm:
        description: >-
          forge-jvm only: space-separated *.jvm.test.ts paths to run instead
          of the full pinned set, e.g. `apps/server/src/play/priority.jvm.test.ts`.
          Empty = today's full set (gated by `changes`' jvm_ui/jvm_server).
        required: false
        default: ''
      only:
        description: 'Which job(s) this dispatch runs.'
        required: false
        type: choice
        default: both
        options:
          - both
          - e2e
          - jvm
      video:
        description: >-
          forge-e2e only: record BOTH browsers of every two-browser spec
          (`CARDTABLE_E2E_VIDEO=1`) and keep the videos as an artifact even on
          success — the operator's gate (2026-10-08): "a recorded video of the
          thing working must be shown to me before it passes".
        required: false
        type: boolean
        default: false
      runs_on:
        description: >-
          A JSON array of runner labels for this dispatch's jobs, e.g.
          `["self-hosted","claw-4"]` — the fleet's jdk21 canary has to land on
          the node it is testing. Empty = the usual jdk21 pool.
        required: false
        default: ''
  # The full set, every night, whatever changed: what path selection (the
  # `changes` job) skipped is still run within a day, and a pinned test that
  # stopped failing, or vanished, is caught by the strict full-run judge.
  schedule:
    - cron: '0 10 * * *'

# Queue, never cancel. On a claw this is no longer about orphaned e2e servers
# holding fixed ports — each job's own systemd unit reaps whatever it leaves
# behind, and ports are chosen per run, so a cancelled job cannot block the
# next one on a bind. What `cancel-in-progress: false` still buys: GitHub
# keeps at most one PENDING run per group, so a burst of pushes collapses to
# the newest rather than queuing every one of them, and a run that WAS
# cancelled mid-flight simply gives no Forge signal for that push — the
# `changes` job above compares against the last run that fully succeeded, not
# the immediate parent, so the next push's `changes` run still covers whatever
# the cancelled one would have.
# A manual dispatch is somebody's proof run (a verify branch, the fleet's
# canary): it never queues behind a push's full run, nor the push behind it —
# each dispatch is its own group.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('forge-dispatch-{0}', github.run_id) || format('forge-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  # ── Which slow jobs this push needs ───────────────────────────────────────
  #
  # A push is compared with the last commit on main whose Forge run fully
  # succeeded, not with its parent: a red or skipped run's changes stay in the
  # range until a green run covers them. Measured on run 37222364036:
  # forge-e2e 8 min, forge-jvm 20 min (UI suites 7, server suites 12). Since
  # 2026-10-06 a push's forge-jvm is under 8 min in all (see that job).
  #   docs, *.md, .claude/**                 nothing slow
  #   unit tests only (*.test.ts, not e2e)    nothing slow; `check` runs them
  #   apps/ui/src/play/** (not css, not the hover zoom), a UI jvm suite
  #                                          e2e + UI jvm suites
  #   other apps/ui/**, e2e/**               e2e
  #   apps/server/**, packages/**, forge, the lockfile, package.json,
  #   this file, scripts/**                  e2e + every jvm suite
  #   anything unclassified                  everything
  # Not a push (a PR, a manual run, the nightly schedule), no green base, a
  # diverged range, or any error here: everything.
  changes:
    name: changes
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.pick.outputs.e2e }}
      jvm_ui: ${{ steps.pick.outputs.jvm_ui }}
      jvm_server: ${{ steps.pick.outputs.jvm_server }}
    steps:
      - name: Pick the jobs this change needs
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          all() { echo "running everything: $1"; { echo e2e=true; echo jvm_ui=true; echo jvm_server=true; } >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = push ] || all "event is $EVENT"
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }
          base=$(api "actions/workflows/forge.yml/runs?branch=main&status=success&per_page=1" | jq -r '.workflow_runs[0].head_sha // empty') || all "could not read the last green run"
          [ -n "$base" ] || all "no green run on main yet"
          cmp=$(api "compare/$base...$HEAD_SHA") || all "could not compare $base...$HEAD_SHA"
          status=$(jq -r .status <<<"$cmp"); n=$(jq -r '.files | length' <<<"$cmp")
          echo "last green $base; this push $HEAD_SHA; $status, $n files"
          [ "$status" = ahead ] || [ "$status" = identical ] || all "range is $status"
          [ "$n" -lt 300 ] || all "$n files, past what the compare API lists"
          e2e=false; ui=false; server=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|*.md|.claude/*) ;;
              apps/server/*|packages/*|forge|pnpm-lock.yaml|package.json|pnpm-workspace.yaml|.github/workflows/forge.yml|scripts/*)
                e2e=true; ui=true; server=true ;;
              apps/ui/*.jvm.test.ts) ui=true ;;
              e2e/*) e2e=true ;;
              *.test.ts|*.test.tsx) ;;
              apps/ui/src/play/*.css|apps/ui/src/play/inspect/*) e2e=true ;;
              apps/ui/src/play/*) e2e=true; ui=true ;;
              apps/ui/*) e2e=true ;;
              *) echo "unclassified: $f"; e2e=true; ui=true; server=true ;;
            esac
          done < <(jq -r '.files[].filename' <<<"$cmp")
          echo "e2e=$e2e jvm_ui=$ui jvm_server=$server"
          { echo "e2e=$e2e"; echo "jvm_ui=$ui"; echo "jvm_server=$server"; } >> "$GITHUB_OUTPUT"

  # ── The Forge e2e: run it, and prove it RAN ─────────────────────────────────
  #
  # Until Wave 17 no CI step set `CARDTABLE_FORGE_JAR`, so `e2e/play.spec.ts`'s
  # match — the ONLY e2e that drives a real child JVM — self-skipped on every
  # run, and a skip reads as a pass. Green CI meant 3 of 4. Found in Wave 16.
  #
  # ON THE CLAWS, since wave forge-claws (2026-10-07). The jar and the
  # vendored Forge `res/` used to exist only on hokon, the production PM2
  # host — this job used to pin `[self-hosted, pm2-host]` for exactly that
  # reason. Now `scripts/forge-bundle.sh` keeps a per-pin bundle
  # (`forge.jar` + `res/`) cached under `~/.cache/cardtable-forge/<pin>/` on
  # whichever claw the job lands on: a cache HIT if that claw already built
  # this pin, a cold BUILD (shallow clone of the pin + a Maven build) if not.
  # `runs-on` below pins `hadoku-builder, jdk21` — the `jdk21` label is what a
  # cold build needs (JDK 21 + Maven on PATH); `vars.CI_RUNNER` is not used
  # here because this job's requirement is narrower than "any claw".
  #
  # NO FIXED PORTS, NO HOST-WIDE LOCKS. A claw runs several jobs at once, for
  # several refs, so nothing here may assume it owns the host the way hokon's
  # single workstation did. Ports are chosen fresh per run (see "pick this
  # run's own ports" below) instead of a hardcoded 29xxx range, and there is
  # no `heavy.lock` — that lock existed only to queue CI behind the operator's
  # own hokon-hosted waves, which is not a claw concern. Each claw job instead
  # runs inside its own memory-capped systemd unit with `KillMode=control-group`,
  # so a server or JVM this job leaves behind dies with the job's unit; the
  # teardown step below is belt and braces, not load-bearing.
  #
  # Production's run directories are not touched: the harness pins the match's
  # work dir to `e2e/.run/play-work` (`PLAY_WORK_DIR`, `e2e/play/harness.ts:64`,
  # passed as `CARDTABLE_PLAY_WORK_DIR` at :149), so its boot sweep never
  # reaches production's `/tmp/cardtable-play`. No env override is needed.
  #
  # `CARDTABLE_FORGE_JAR` / `CARDTABLE_FORGE_RES` are resolved once, early in
  # the job, by the bundle step below, and exported via `GITHUB_ENV` so every
  # later step sees them without repeating the lookup — no step hardcodes
  # either path any more.
  #
  # Runs beside `ci.yml`'s `check` (its own workflow since 2026-10-07; this
  # workflow's `concurrency` group queues a newer push rather than cancelling).
  forge-e2e:
    name: forge-e2e
    needs: changes
    # `inputs.only` is '' on every push/PR/schedule (no `inputs` context on
    # those triggers), so the added clause is always true there and this job
    # runs exactly when it did before: gated on `changes.outputs.e2e` alone.
    # On a dispatch, `only: jvm` turns this job off.
    if: needs.changes.outputs.e2e == 'true' && (inputs.only == '' || inputs.only == 'both' || inputs.only == 'e2e')
    runs-on: ${{ inputs.runs_on != '' && fromJSON(inputs.runs_on) || fromJSON('["self-hosted","hadoku-builder","jdk21"]') }}
    # The suite is serial by design (`e2e/playwright.config.ts`: one worker, one
    # stack at a time), so a full run is ~30 min on one claw however idle the
    # claw is (measured 2026-10-08 by the fleet tracker: load 6 of 12 cores).
    # Three shards are three jobs on three claws — each its own ports, its
    # own JVMs — and Playwright's `--shard` splits the file list. A targeted
    # dispatch (`specs` given) is one shard: its list is already short.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.specs != '' && '[1]' || '[1, 2, 3]') }}
    # Measured on run 37184116178 (the 9-spec derived list): ~15 min of test
    # time with three reds burning their own budgets (play.spec alone 312 s),
    # plus install and build. On a claw the same budget also has to cover a
    # cold bundle BUILD on a miss. SETTLED from this wave's proof dispatches
    # (pin e5db05107c…): a FULL cold BUILD end to end (clone, maven, jar
    # verify, the `forge-gui/res` copy, atomic mv) is 74–100 s, bundle 504M —
    # nowhere near the 10–20 min this file guessed before any claw had built
    # one; a cache HIT costs ~6–11 s. The slow case is contention, not the
    # BUILD: with 3 of 4 proof jobs landing on one claw at once (two forge-e2e
    # + one forge-jvm sharing claw-9), THIS job ran 34.9–36.1 min against its
    # usual ~16–18 min (one extra Playwright red each time under the load —
    # product content, not a hang: `main`'s own two known reds plus one more).
    # 40 is the baseline (no lock wait any more); +15 covers the measured
    # BUILD plus that observed contention with headroom.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6

      # Same as `check` — see the comments there.
      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        id: pnpm
        with:
          node-version: '24'
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}
          vault-key: ${{ secrets.KEY_SERVICE_CARDTABLE }}

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      - name: Build the bundle
        run: pnpm --filter @hadoku/ui build

      - name: Build the server
        run: pnpm --filter @hadoku/server build

      - name: E2E — browser
        run: pnpm --filter @hadoku/e2e exec playwright install chromium

      # Per-pin bundle (ledger Y26, carried forward by wave forge-claws): the
      # jar and res/ are shared across every claw that has built this pin, so
      # an install mid-run on ANOTHER job no longer invalidates this one — each
      # pin gets its own cache entry under `scripts/forge-bundle.sh`'s cache
      # root, never production's `~/.local/share/cardtable/jars/`. Exported via
      # `GITHUB_ENV` so every later step's `$CARDTABLE_FORGE_JAR` /
      # `$CARDTABLE_FORGE_RES` are this pin's bundle without repeating the
      # lookup.
      - name: Resolve the Forge bundle for this commit's pin
        run: bash scripts/forge-bundle.sh >> "$GITHUB_ENV"

      # Two guards, because either alone is a check that can pass by doing
      # nothing:
      #
      #   1. Forge present, or FAIL. Mirrors `forgeAvailability()` in the
      #      harness arm for arm — a missing jar or a `res/` without
      #      `cardsfolder` would make the specs skip, so here it reds instead.
      #      (The bundle step above already fails loudly on the same
      #      conditions; this repeats the check so a step reordering cannot
      #      silently drop the guard.)
      #   2. Nothing skipped, or FAIL. Guard 1 cannot see a skip from any
      #      OTHER cause. So Playwright also writes a JSON report, and the step
      #      asserts `stats.skipped == 0` from it — reading the tool's own
      #      tally, not grepping its console. `PW_TEST_REPORTER` is Playwright's
      #      env hook for adding a reporter without touching the config
      #      (pinned 1.62.1; `playwright/lib/runner/index.js`). If an upgrade
      #      ever drops it, the report file is simply absent — and `jq` on an
      #      absent file exits non-zero, so that reds too rather than passing.
      - name: E2E — Forge is present, or fail
        run: |
          test -f "$CARDTABLE_FORGE_JAR" || { echo "::error::CARDTABLE_FORGE_JAR missing: $CARDTABLE_FORGE_JAR — the Forge specs would SKIP"; exit 1; }
          test -d "$CARDTABLE_FORGE_RES/cardsfolder" || { echo "::error::CARDTABLE_FORGE_RES has no cardsfolder: $CARDTABLE_FORGE_RES — the Forge specs would SKIP"; exit 1; }

      # Four free loopback ports, chosen fresh per run instead of a fixed
      # 29xxx range: several jobs can run on one claw at once, maybe for
      # different refs, so a fixed range would collide. Binding port 0 and
      # reading it back is the standard "ask the kernel" trick (node 24 is on
      # PATH after setup-pnpm). The ports are released again before the
      # harness binds them for real, which leaves a small window where
      # something else on the same claw could grab one first. Accepted rather
      # than closed: the window is milliseconds, a claw runs only a handful of
      # jobs at once, and losing the race shows up as a loud bind failure in
      # the harness below, never a silent wrong port.
      - name: E2E — pick this run's own ports
        run: |
          read -r SERVER PLAY_SERVER EDGE PLAY_EDGE < <(node -e '
            const net = require("net");
            const servers = [];
            const ports = [];
            function next(i, done) {
              if (i === 4) return done();
              const s = net.createServer();
              s.listen(0, "127.0.0.1", () => { ports.push(s.address().port); servers.push(s); next(i + 1, done); });
            }
            next(0, () => { servers.forEach((s) => s.close()); console.log(ports.join(" ")); });
          ')
          { echo "CARDTABLE_E2E_SERVER_PORT=$SERVER"; echo "CARDTABLE_E2E_PLAY_SERVER_PORT=$PLAY_SERVER"; echo "CARDTABLE_E2E_EDGE_PORT=$EDGE"; echo "CARDTABLE_E2E_PLAY_EDGE_PORT=$PLAY_EDGE"; } >> "$GITHUB_ENV"
          echo "::notice::this run's ports: server=$SERVER play-server=$PLAY_SERVER edge=$EDGE play-edge=$PLAY_EDGE"

      # ONLY the Forge specs; the draft already ran in `check`. The file names
      # are appended by pnpm to the END of the package script, so they reach
      # `playwright test` (the script's last command), not `node --test`.
      # The draft harness still boots as Playwright's `webServer` — that is the
      # config's, not the spec filter's.
      #
      # The list is derived in the step below, not hand-kept here: any spec
      # that starts a real Forge stack (`forge.ok`, `startPlayStack` or
      # `startScenarioMatch`) is included automatically, so a new Forge-gated
      # spec file is covered the moment it is added instead of by a second
      # edit to a list that is easy to forget.
      # This run's own ports (chosen above) are exported via `GITHUB_ENV`, so
      # the harness reads them the same way it reads the local 19xxx default —
      # no job-wide `env:` holds a fixed range any more.
      - name: E2E — two friends play a real Forge match, and the table fits
        env:
          PW_TEST_REPORTER: json
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/forge-e2e-report.json
          # Every stack's JVM run dir survives the run (see `harness.ts`), so
          # the evidence step below can send the failing one's stderr.
          CARDTABLE_E2E_WORK_DIRS_KEPT: '96'
          # '' on every push/PR/schedule — see the `on:` block above.
          SPECS_OVERRIDE: ${{ inputs.specs }}
          # '1' only on a dispatch with `video: true`; the harness records
          # every two-browser context under `e2e/.run/videos/<spec>/<name>.webm`.
          CARDTABLE_E2E_VIDEO: ${{ inputs.video == true && '1' || '' }}
        run: |
          # The host line a flaky red needs first. No `heavy.lock` any more —
          # that lock queued CI behind the operator's hokon-hosted waves, which
          # a claw does not run; each claw job is its own memory-capped unit
          # instead (see the job comment above, and item 7 of the wave note on
          # watching for OOM).
          echo "host at start: $(uptime)"; free -m | sed -n 2p
          rm -f "$PLAYWRIGHT_JSON_OUTPUT_FILE"
          if [ -n "$SPECS_OVERRIDE" ]; then
          # A targeted dispatch (`-f specs='table-fit -g "a live match fits"'`):
          # skip the derivation below entirely, so a narrow override can never
          # trip "no Forge-gated spec found". `eval` is deliberate — the
          # override can carry its own quoting (a `-g` pattern with spaces),
          # and this value only ever comes from a manual `workflow_dispatch`
          # by someone who could already dispatch this workflow, the same
          # trust boundary `workflow_dispatch` itself sits behind. (Not
          # further indented: the heredoc below needs its `NONE` terminator at
          # column 0 after YAML's own dedent, so this whole script is kept
          # flush rather than nested under `if`/`else`.)
          echo "forge-e2e: spec override: $SPECS_OVERRIDE"
          eval "pnpm --filter @hadoku/e2e test $SPECS_OVERRIDE"
          else
          # Specs held OUT of the derived list, one per line as `<file>  # <why>`.
          # Empty means every Forge-gated spec runs; an entry is a known red
          # with its reason, never a quiet way to drop a spec.
          excluded=$(cat <<'NONE'
          w63-yield.spec.ts  # AE24: red 4/4 in full runs, green alone — the engine-silence shape (the fork's encode error, no trace until the pin logs {exception}); back the day the trace is read
          NONE
          )
          specs=$(grep -lE 'forge\.ok|startPlayStack|startScenarioMatch' e2e/*.spec.ts | xargs -n1 basename | sort)
          for x in $(printf '%s\n' "$excluded" | sed -E 's/#.*//'); do
            echo "::warning::$x is excluded from forge-e2e: $(printf '%s\n' "$excluded" | grep -F "$x")"
            specs=$(printf '%s\n' "$specs" | grep -vxF "$x" || true)
          done
          [ -n "$specs" ] || { echo "::error::no Forge-gated spec found — the grep matched nothing"; exit 1; }
          echo "forge-gated specs (derived), shard ${{ matrix.shard }}/${{ strategy.job-total }}:"
          echo "$specs"
          pnpm --filter @hadoku/e2e test --shard=${{ matrix.shard }}/${{ strategy.job-total }} $specs
          fi
          jq -e '.stats.skipped == 0 and .stats.unexpected == 0 and .stats.expected > 0' "$PLAYWRIGHT_JSON_OUTPUT_FILE" > /dev/null || { echo "::error::e2e report: $(jq -c .stats "$PLAYWRIGHT_JSON_OUTPUT_FILE" 2>&1) — a skipped test is not a pass"; exit 1; }

      # The evidence a red needs, kept past the job. Playwright's per-test
      # error context and the harness's per-stack server logs live under
      # `e2e/.run/`, which the NEXT run wipes — on 2026-10-03 two reds
      # (R13, T1) had nothing left to read by the time anyone looked. Text
      # only: of the JVM run dirs (`play-work/`) just the bridge's stderr and
      # the two small json files, never Forge's `res/` or `cache/`.
      - name: E2E evidence (on failure)
        # cancelled() too: a run cut off by timeout-minutes is the one whose
        # evidence matters most, and failure() alone uploaded nothing for it.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: forge-e2e-evidence-${{ github.run_attempt }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          # `e2e/.run/` is a dot-directory and the action skips those by
          # default — the first upload (run 37155619558) carried only the report.
          include-hidden-files: true
          path: |
            e2e/.run/test-results/**
            e2e/.run/*.jsonl
            e2e/.run/*.json
            e2e/.run/*.log
            e2e/.run/play-logs/**
            e2e/.run/play-work/*/*/bridge.stderr.txt
            e2e/.run/play-work/*/*/jvm.json
            e2e/.run/play-work/*/*/config.json
            ${{ runner.temp }}/forge-e2e-report.json

      # The operator's evidence: both screens of every recorded spec, kept on
      # SUCCESS too — a green run is the one whose video gets watched.
      - name: E2E videos (when asked)
        if: always() && inputs.video == true
        uses: actions/upload-artifact@v6
        with:
          name: forge-e2e-videos-${{ github.run_attempt }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: e2e/.run/videos/**

      # Whatever this job started stops with it, passed, failed or cancelled: an
      # e2e server still listening on this run's ports, or a Forge JVM under this
      # workspace's e2e run dir. This run's own ports (picked above) are read
      # from the env this job already carries — harmless on a claw (each job's
      # systemd unit already reaps its own tree on exit) but kept because it
      # costs nothing and catches whatever the unit teardown does not.
      - name: E2E — stop this run's servers and JVMs
        if: always()
        run: |
          for pid in $(ss -ltnpH "( sport = :$CARDTABLE_E2E_SERVER_PORT or sport = :$CARDTABLE_E2E_PLAY_SERVER_PORT or sport = :$CARDTABLE_E2E_EDGE_PORT or sport = :$CARDTABLE_E2E_PLAY_EDGE_PORT )" 2>/dev/null | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u); do
            case "$(readlink /proc/$pid/cwd 2>/dev/null)" in
              "$GITHUB_WORKSPACE"*) echo "::warning::stopping orphaned e2e server pid $pid from this run"; kill -TERM "$pid" || true ;;
            esac
          done
          for p in /proc/[0-9]*; do
            case "$(readlink "$p/exe" 2>/dev/null)" in */bin/java) ;; *) continue ;; esac
            case "$(readlink "$p/cwd" 2>/dev/null)" in "$GITHUB_WORKSPACE/e2e/.run"*) kill -TERM "${p#/proc/}" || true ;; esac
          done

  # ── The jar-gated suites: a real child Forge JVM per test, run serially ──
  #
  # `*.jvm.test.ts` builds a real Forge match the same way `forge-e2e` does,
  # and self-skips without `CARDTABLE_FORGE_JAR`/`CARDTABLE_FORGE_RES` (the
  # same `jvmHostConfig` check `forge-e2e` guards above). `check` runs on the
  # fleet's claws without a Forge bundle resolved, so these suites always
  # self-skipped there — and a skip reads as a pass, so none of them has ever
  # gated anything before this job.
  #
  # PARALLEL WITH forge-e2e, since wave forge-claws (2026-10-07). The two jobs
  # used to be ordered (`needs: forge-e2e`, `if: always()`) purely because they
  # shared hokon, one host. On the claws each job is scheduled independently
  # onto whichever `hadoku-builder, jdk21` claw has room, so nothing here
  # serialises them any more — `needs: changes` alone, and the `if:` below
  # keeps the same "only when a jvm suite is in scope" gate without the
  # ordering `always()`. Two JVM-heavy jobs CAN still land on the same claw at
  # once; that is the memory question item 7 of the wave note asks every lane
  # to watch, not an ordering one.
  #
  # `--fileParallelism=false` inside the job for a related but separate
  # reason: each file spawns its own JVM, and vitest forking several at once
  # within ONE job would recreate, inside that job's own CPU budget, the exact
  # contention the old ordering existed to avoid between jobs.
  #
  # The JSON report goes to a file and is judged by its own step, so a run
  # that dies before writing it is a red, not a silent pass.
  #
  # NIGHTLY-ONLY TESTS. Three things were half of this job's 25 minutes
  # (run 37487474250: 745 of 1483 s) and none of them earns a place on every
  # push: `library-match` starts 31 matches to prove the deck library loads;
  # `scenario-start` repeated each start ten times where three already catch
  # the race 7999 times in 8000; and one `prompts.jvm` case pinned as
  # `known_failing` burned its whole 180 s budget to fail the same way. So a
  # test may gate itself on `nightly` (`apps/server/src/play/scenario.ts`),
  # and must then carry `[nightly]` in its title. `CARDTABLE_JVM_NIGHTLY=1` is
  # set on every run that is not a push, so the schedule, a manual run and a
  # PR still run all of it. The judge below accepts a `[nightly]` skip on a
  # push and nowhere else.
  forge-jvm:
    name: forge-jvm
    needs: changes
    # `inputs.only` is '' on every push/PR/schedule, so the added clause is
    # always true there — same gate as before. On a dispatch, `only: e2e`
    # turns this job off.
    if: (needs.changes.outputs.jvm_ui == 'true' || needs.changes.outputs.jvm_server == 'true') && (inputs.only == '' || inputs.only == 'both' || inputs.only == 'jvm')
    runs-on: ${{ inputs.runs_on != '' && fromJSON(inputs.runs_on) || fromJSON('["self-hosted","hadoku-builder","jdk21"]') }}
    # Since 2026-10-06: the 39 suites a push runs took
    # 457 s (7.6 min). They were 1483 s on run 37487474250, before the
    # nightly-only split, the harness killing its JVMs instead of waiting
    # 4.4 s for each to stop, and the bridge being compiled once. SETTLED from
    # this wave's proof dispatches, all FULL+NIGHTLY (a `workflow_dispatch`
    # always runs the full nightly set, a ceiling a push never reaches): an
    # uncontended run took 1579–1676 s (26–28 min) with a 68–100 s cold BUILD
    # beside it (see the identical measurement note on `forge-e2e` above). The
    # worst observed, with 3 of 4 proof jobs sharing one claw at once, was
    # 2249 s (37.5 min) — still a content judge failure, not a timeout. 30 is
    # the baseline (no lock wait any more); +20 covers that measured
    # contention case with real headroom, not just the uncontended ceiling.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      # Same as `check` and `forge-e2e` — see the comments on `check`.
      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        id: pnpm
        with:
          node-version: '24'
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}
          vault-key: ${{ secrets.KEY_SERVICE_CARDTABLE }}

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      # Per-pin bundle (ledger Y26, carried forward by wave forge-claws) — see
      # the identical step in `forge-e2e` for why. `GITHUB_ENV` carries
      # `CARDTABLE_FORGE_JAR` / `CARDTABLE_FORGE_RES` to every later step in
      # this job.
      - name: Resolve the Forge bundle for this commit's pin
        run: bash scripts/forge-bundle.sh >> "$GITHUB_ENV"

      - name: Forge is present, or every suite would SKIP
        run: |
          test -f "$CARDTABLE_FORGE_JAR" || { echo "::error::CARDTABLE_FORGE_JAR missing: $CARDTABLE_FORGE_JAR — every jvm suite would SKIP"; exit 1; }
          test -d "$CARDTABLE_FORGE_RES/cardsfolder" || { echo "::error::CARDTABLE_FORGE_RES has no cardsfolder: $CARDTABLE_FORGE_RES — every jvm suite would SKIP"; exit 1; }

      # Not production's run directory: `runner.temp` is wiped per-job by the
      # runner itself, so no boot sweep logic is needed to keep this off
      # `/tmp/cardtable-play`.
      - name: Run every *.jvm.test.ts, serially
        env:
          CARDTABLE_PLAY_WORK_DIR: ${{ runner.temp }}/cardtable-jvm-play
          JVM_UI: ${{ needs.changes.outputs.jvm_ui }}
          JVM_SERVER: ${{ needs.changes.outputs.jvm_server }}
          CARDTABLE_JVM_NIGHTLY: ${{ github.event_name != 'push' && '1' || '0' }}
          # '' on every push/PR/schedule — see the `on:` block above.
          JVM_OVERRIDE: ${{ inputs.jvm }}
        run: |
          # No `heavy.lock` any more — see the job comment above. The host
          # line a flaky red needs first, still worth keeping on a claw.
          echo "host at start: $(uptime)"; free -m | sed -n 2p
          mkdir -p "$CARDTABLE_PLAY_WORK_DIR"
          report="${{ runner.temp }}/forge-jvm-report.json"
          rm -f "$report"
          if [ -n "$JVM_OVERRIDE" ]; then
            # A targeted dispatch (`-f jvm='apps/server/src/play/priority.jvm.test.ts'`):
            # run exactly these paths instead of deriving the full set, and the
            # judge step below drops to its "partial run" (`FULL=false`) mode
            # automatically since `inputs.jvm` is non-empty there too.
            files="$JVM_OVERRIDE"
            echo "forge-jvm: jvm override: $files"
          else
            # `changes` picks the groups; both together is the full set.
            files=""
            [ "$JVM_UI" = true ] && files="$files $(git ls-files 'apps/ui/*.jvm.test.ts')"
            [ "$JVM_SERVER" = true ] && files="$files $(git ls-files 'apps/server/*.jvm.test.ts')"
            extra=$(git ls-files '*.jvm.test.ts' | grep -vE '^apps/(ui|server)/' || true)
            [ -z "$extra" ] || { echo "::error::jvm suites outside apps/ui and apps/server, which no group runs: $extra"; exit 1; }
          fi
          [ -n "$files" ] || { echo "::error::no *.jvm.test.ts tracked — nothing to run"; exit 1; }
          echo "jvm suites ($(printf '%s\n' "$files" | wc -l)):"
          echo "$files"
          # vitest's own exit code would red the job on a pinned failure; the
          # next step judges the report by name instead, and reds a missing one.
          pnpm exec vitest run --fileParallelism=false --reporter=default --reporter=json --outputFile="$report" $files \
            || echo "::notice::vitest exited $? — the report is judged in the next step"

      # The report is judged by name, not by count, against two pinned lists,
      # and either list going stale in EITHER direction is a red:
      #  - a skip (or todo) that is not on `expected_skips`, or one on it that
      #    no longer skips. With the jar present no `describe.skipIf` fires,
      #    so that list is empty.
      #  - a failure that is not on `known_failing`, or a pinned test that no
      #    longer fails (it passed, or is gone). So the list can only shrink:
      #    fixing a pinned test reds the job until its line is deleted.
      #  - `known_flaky` is for a measured race that passes some runs: it may
      #    pass or fail, but it must still exist. Each entry names its rate.
      # Each entry is a test's full name (`describe > it`), with a comment
      # above it giving the one-line reason and the evidence file.
      # A report that was never written is a red too, not a silent pass.
      - name: Every jvm suite ran, and nothing failed or skipped off the pinned lists
        if: always()
        env:
          # A partial run (one group, or a `jvm` override) judges only the
          # pinned tests it ran; the full run (both groups, every night at
          # least, no override) judges all of them. `inputs.jvm != ''` forces
          # the partial path on a targeted dispatch even when both groups
          # would otherwise read `true`.
          FULL: ${{ inputs.jvm == '' && needs.changes.outputs.jvm_ui == 'true' && needs.changes.outputs.jvm_server == 'true' }}
          # Whether the `[nightly]` tests ran: the same test as CARDTABLE_JVM_NIGHTLY above.
          NIGHTLY: ${{ github.event_name != 'push' }}
        run: |
          report="${{ runner.temp }}/forge-jvm-report.json"
          test -s "$report" || { echo "::error::$report is empty or missing — the jvm run did not finish writing its report"; exit 1; }
          # One full test name per line; `#` lines are the reasons, not entries.
          # `grep` exits 1 on an empty list, which the runner's pipefail would turn into a red.
          pinned() { { grep -vE '^[[:space:]]*(#|$)' || true; } | jq -R . | jq -sc 'sort'; }
          expected_skips=$(pinned <<'LIST'
          LIST
          )
          known_failing=$(pinned <<'LIST'
          # Stalls after seat 1 answers its first confirm, every run, on main too. docs/planning/wave38-evidence/U-prompts-jvm-red.md
          the fifteen prompts against a real Forge match [nightly] choices: confirm, order, tempShowZones, getChoices, showInputDialog, chooseSingleEntityForEffect
          LIST
          )
          known_flaky=$(pinned <<'LIST'
          # :663 fixed in w49; the declined-click bound (2) is then exceeded 3 of ~11 runs under `taskset -c 0`, 0 of 10 unpinned. docs/planning/wave49-evidence/B/README.md §1
          playing by clicking the board, against a real Forge match a player plays a land and casts spells — one targeted — by clicking their own board
          # The block input opens and closes with nobody pressing, 3 of 4 runs. docs/planning/wave38-evidence/J-blockers.md
          Declare Blockers, set up by a scenario, against real Forge Q12: a defender with one creature is NOT auto-passed through Declare Blockers, and can assign the block
          # The first cast after a scenario start never reaches the stack, 1 of 4 CI runs (37204094431; green on 37184116178, 37184691254, 37186194601). Undiagnosed: no frame dump on failure. Owner: w40 (bridge), beside the decode race in wave37-evidence/A-repro.md §8.
          wave 35 §S follow-up: a spell resolves unattended for the seat holding only lands, against real Forge seat 1 holds only untapped lands while seat 0's spell is on the stack, and is auto-passed without ever acting
          LIST
          )
          jq -e --argjson full "$FULL" --argjson nightly "$NIGHTLY" --argjson skips "$expected_skips" --argjson failing "$known_failing" --argjson flaky "$known_flaky" '
            [.testResults[].assertionResults[]] as $all
            | [$all[].fullName] as $ran
            | def inrun: if $full then . else map(select(. as $n | $ran | index($n) != null)) end;
              # On a push the `[nightly]` tests gate themselves off: that skip is
              # expected, and a pin on one of them has nothing to be judged against.
              def onpush: if $nightly then . else map(select(contains("[nightly]") | not)) end;
              ($failing | inrun | onpush) as $failing
            | ($skips | inrun) as $skips
            | ([$all[] | select(.status == "failed") | .fullName] | sort - $flaky) as $failed
            | ([$all[] | select(.status != "passed" and .status != "failed") | .fullName] | sort | onpush) as $skipped
            | {
                "failed, not pinned": ($failed - $failing),
                "pinned as failing, did not fail": ($failing - $failed),
                "skipped, not pinned": ($skipped - $skips),
                "pinned as skipped, did not skip": ($skips - $skipped),
                "no tests at all": (if ($all | length) == 0 then ["the report holds no test"] else [] end)
              }
            | . + {"pinned as flaky, not in the report": (if $full then ($flaky - $ran) else [] end)}
            | with_entries(select(.value | length > 0))
            | if length == 0 then true else (., false) end
          ' "$report" || { echo "::error::the jvm report does not match the pinned lists (see the object above)"; exit 1; }

      # What a timed-out scenario leaves behind: `waitUntil`'s dump (the seat's
      # last frames, the server's stop decisions, the bridge's stderr tail —
      # `apps/server/src/play/scenario.ts`), written next to the JVMs' run
      # directories. The runner wipes `runner.temp` with the next run, and the
      # error line in the log carries only the last 20 frame methods: run
      # 37532893898 (2026-10-06) lost the blockers Q12 dump that way, so its red
      # could not be read. Kept on a red, like forge-e2e's evidence — and the
      # job's LAST step, because vitest's own exit is swallowed above and the
      # judge just before this is what makes the job red.
      - name: Keep the jvm dumps and bridge logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: forge-jvm-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cardtable-jvm-play/*.dump.json
            ${{ runner.temp }}/cardtable-jvm-play/*/bridge.stderr.txt
            ${{ runner.temp }}/forge-jvm-report.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
