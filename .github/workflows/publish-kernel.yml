name: Publish platform packages

# The MIT platform packages (scripts/publish/manifest.ts's PUBLISHED) → @hadoku/<name> on npmjs,
# where the fleet's consumers install them from (their @wolffm/* names are npmjs aliases), and
# @wolffm/<name> on GitHub Packages.
#
# NPMJS FIRST, GITHUB PACKAGES LAST (#75). A version reaching GitHub Packages is what dispatches the
# children's update-wolffm (packages_updated → hadoku_site → wolffm_published), and their wait for
# npmjs to serve it is bounded (hadoku-actions update-wolffm, 390 s). Published per package the old
# way, platform-wire was on GitHub Packages at 00:59 and on npmjs at 01:14 (run 44432731632), and
# bomberman gave up. So `publish` only stages, `npmjs` publishes, and `github-packages` publishes
# last, when every version is already on npmjs. A sibling's version is the one its leg staged
# (the `publish-version-*` artifacts), since GitHub Packages does not have it yet. Cardtable itself never installs
# them: its own server and UI import the workspace copies. The shape is hadoku-watchparty's
# publish-packages.yml, and the npmjs half is hadoku_site's docs/operations/NPMJS_PUBLISHING.md.
#
# THE FILE NAME STAYS publish-kernel.yml. npmjs trusts exactly one workflow FILE per package
# (`npm trust github … --file publish-kernel.yml`), and @hadoku/service-kernel's trust already
# names this one; renaming it would break that package's npmjs publish. Every other package here
# is trusted on the same file when its first publish is done.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/platform-wire/**'
      - 'packages/host-wire/**'
      - 'packages/room-ask/**'
      - 'packages/service-kernel/**'
      - 'packages/ui-shell/**'
      - 'packages/game-server/**'
      - 'packages/game-ui/**'
      - 'scripts/publish/**'
      - '.github/workflows/publish-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Each run computes "one patch above the registry's newest", so two at once
# race for the same version. Queue, never cancel.
concurrency:
  group: publish-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    # One package at a time, in this order: a package after every sibling it depends on, because
    # its manifest names each sibling at the version the registry has for it NOW (manifest.ts).
    # A failure stops the rest, so no dependent publishes against a sibling that did not.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - { package: platform-wire, npmjs: NPMJS_PLATFORM_WIRE }
          - { package: host-wire, npmjs: NPMJS_HOST_WIRE }
          - { package: room-ask, npmjs: NPMJS_ROOM_ASK }
          - { package: service-kernel, npmjs: NPMJS_SERVICE_KERNEL }
          - { package: ui-shell, npmjs: NPMJS_UI_SHELL }
          - { package: game-server, npmjs: NPMJS_GAME_SERVER }
          - { package: game-ui, npmjs: NPMJS_GAME_UI }
    env:
      DIR: packages/${{ matrix.package }}
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        id: pnpm
        with:
          node-version: '24'
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}
          vault-key: ${{ secrets.KEY_SERVICE_CARDTABLE }}

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      # The versions earlier legs of this run staged: their siblings are not on
      # GitHub Packages until the last job, so the manifest reads them here.
      - name: Siblings this run staged
        uses: actions/download-artifact@v7
        with:
          pattern: publish-version-*
          path: ${{ runner.temp }}/versions
          merge-multiple: true

      # BEFORE the version step: next-version reads the registry under the
      # manifest's name, which is @wolffm/<name> only after this. Each sibling's
      # version is the one this run staged, else the registry's. Written in the
      # runner's checkout, never committed back.
      - name: Write the published manifest
        run: node scripts/publish/manifest.ts "$DIR"
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}
          PUBLISH_VERSIONS: ${{ runner.temp }}/versions

      # The version is CI's, never a commit's: one patch above the registry's
      # newest. A committed version above it is kept, so a deliberate minor
      # bump still works.
      - name: Version ${{ matrix.package }}
        id: version
        uses: WolffM/hadoku-actions/next-version@v1
        with:
          package-dir: ${{ env.DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      - name: Build
        run: node scripts/publish/build.ts "$DIR"

      # Every dist/ path npmjs's newest version shipped is still built, or publishRemoved names it
      # (game-ui 0.1.104 lost six modules and stayed green: bomberman#15). New, so it warns until
      # its false-positive rate is known: set the repo variable PUBLISH_SHIPPED_GATE=block to make
      # a lost path stop the publish.
      - name: Ships everything ${{ matrix.package }} shipped before
        continue-on-error: ${{ vars.PUBLISH_SHIPPED_GATE != 'block' }}
        run: node scripts/publish/shipped.ts "$DIR"

      # A patch breaks no consumer that compiled against npmjs's newest: every exported type and
      # value is compared with the checker, and a narrowed one needs a minor bump (service-kernel
      # 0.1.137 made EraseStep.merge required as a patch and watchparty crash-looped: #100). New,
      # so it warns until its false-positive rate is known: set the repo variable
      # PUBLISH_SURFACE_GATE=block to make a break stop the publish.
      - name: Breaks nothing ${{ matrix.package }} consumers compiled against
        continue-on-error: ${{ vars.PUBLISH_SURFACE_GATE != 'block' }}
        run: node scripts/publish/surface.ts "$DIR"

      # Packed here, published by `github-packages` after npmjs has it. The
      # file is named by the leg's place in the matrix, which is PUBLISHED's
      # order, so that job publishes a sibling before its dependents.
      - name: Pack for GitHub Packages
        working-directory: ${{ env.DIR }}
        env:
          INDEX: ${{ strategy.job-index }}
          PUBLISHED: ${{ steps.version.outputs.published }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ghpkg"
          mkdir -p "$out" "$RUNNER_TEMP/version-out"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          tar tzf "$RUNNER_TEMP"/pack/*.tgz | sort
          if [ "$PUBLISHED" != 'true' ]; then
            mv "$RUNNER_TEMP"/pack/*.tgz "$out/$INDEX-${{ matrix.package }}.tgz"
            echo "$VERSION" > "$RUNNER_TEMP/version-out/${{ matrix.package }}"
          fi
          rm -rf "$RUNNER_TEMP/pack"

      - name: Stage ${{ matrix.package }} for GitHub Packages
        if: steps.version.outputs.published != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ghpkg-${{ matrix.package }}
          path: ${{ runner.temp }}/ghpkg/${{ strategy.job-index }}-${{ matrix.package }}.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Hand ${{ matrix.package }}'s version to its dependents
        if: steps.version.outputs.published != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: publish-version-${{ matrix.package }}
          path: ${{ runner.temp }}/version-out/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 3

      # npmjs takes a package only once its trusted publisher exists, which
      # needs a first publish by hand (hadoku_site docs/requests/). Until the
      # package's repo variable (matrix.npmjs) is `live`, this stage runs as a
      # dry run: it packs, renames, runs the leak gate and prints the file list,
      # and uploads nothing, so the hosted job below has nothing of it to publish.
      # A dry run that the gate refuses is reported, not fatal: the gate's
      # findings are what the first-publish request is decided on.
      - name: Is the npmjs half live?
        id: npmjs
        run: echo "live=${{ vars[matrix.npmjs] == 'live' }}" >> "$GITHUB_OUTPUT"

      - name: Stage ${{ matrix.package }} for npmjs
        continue-on-error: ${{ steps.npmjs.outputs.live != 'true' }}
        uses: WolffM/hadoku-actions/publish-npmjs@v1
        with:
          package-dir: ${{ env.DIR }}
          dry-run: ${{ steps.npmjs.outputs.live != 'true' }}

      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          # The `cardtable:` prefix is literal, so hadoku_site's check:report-coverage can read the
          # worker off the file. service-kernel keeps the name the fleet's ci-watch already
          # covers (cardtable:publish-kernel); the rest are cardtable:publish-<package>.
          job-name: cardtable:publish-${{ matrix.package == 'service-kernel' && 'kernel' || matrix.package }}
          service-key: ${{ secrets.KEY_SERVICE_CARDTABLE }}
          started-at: ${{ env.JOB_STARTED_AT }}

  # Trusted publishing refuses self-hosted runners: the job above staged the
  # gated tarballs, and this hosted job (no checkout, no secret) hands them to
  # npm. It runs when any package's npmjs half is live; it publishes only what
  # was staged, which is only the live ones.
  npmjs:
    needs: publish
    if: >-
      needs.publish.result == 'success' && (
        vars.NPMJS_PLATFORM_WIRE == 'live' || vars.NPMJS_HOST_WIRE == 'live' ||
        vars.NPMJS_ROOM_ASK == 'live' || vars.NPMJS_SERVICE_KERNEL == 'live' ||
        vars.NPMJS_UI_SHELL == 'live' || vars.NPMJS_GAME_SERVER == 'live' ||
        vars.NPMJS_GAME_UI == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      actions: read
    outputs:
      started-at: ${{ steps.start.outputs.at }}
    steps:
      - name: Mark the start, for npmjs-report's duration
        id: start
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: WolffM/hadoku-actions/publish-npmjs/publish@v1

  # The hosted job cannot report for itself (Cloudflare challenges a
  # GitHub-hosted runner before any worker runs), so our runner reports it.
  npmjs-report:
    needs: [publish, npmjs]
    if: always() && needs.npmjs.result != 'skipped'
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 5
    steps:
      - name: Carry the hosted job's start, so the reported duration is real
        run: echo "JOB_STARTED_AT=${{ needs.npmjs.outputs.started-at }}" >> "$GITHUB_ENV"

      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: cardtable:publish-kernel-npmjs
          outcome: ${{ needs.npmjs.result }}
          service-key: ${{ secrets.KEY_SERVICE_CARDTABLE }}
          started-at: ${{ env.JOB_STARTED_AT }}

  # Last, so a version is on npmjs before GitHub Packages has it: GitHub Packages
  # is what dispatches the children's update-wolffm, and their wait for npmjs is
  # bounded (#75). Not after a failed npmjs publish, which would send children
  # after a version npmjs will never serve; the next run publishes both.
  github-packages:
    needs: [publish, npmjs]
    if: >-
      always() && needs.publish.result == 'success' &&
      (needs.npmjs.result == 'success' || needs.npmjs.result == 'skipped')
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 10
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'

      - uses: actions/download-artifact@v7
        with:
          pattern: ghpkg-*
          path: ${{ runner.temp }}/ghpkg
          merge-multiple: true

      - name: Publish to GitHub Packages, in PUBLISHED's order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ghpkg"
          shopt -s nullglob
          files=("$dir"/*.tgz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nothing was staged for GitHub Packages in this run."
            exit 0
          fi
          for f in $(printf '%s\n' "${files[@]}" | sort -V); do
            name=$(tar xzOf "$f" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); `${p.name}@${p.version}`')
            npm publish "$f"
            echo "📦 Published $name"
          done

      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: cardtable:publish-github-packages
          service-key: ${{ secrets.KEY_SERVICE_CARDTABLE }}
          started-at: ${{ env.JOB_STARTED_AT }}
