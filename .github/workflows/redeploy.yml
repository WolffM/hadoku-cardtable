# Ask hadoku_site to redeploy the `cardtable` PM2 service.
#
# Lives here, runs on push to main. hadoku_site's redeploy-service.yml listens
# for `repository_dispatch: redeploy_service` and delegates to mgmt-api, which
# per its deploy-config.json does: git pull -> pnpm install && pnpm build ->
# pm2 restart cardtable (serving 127.0.0.1:9008 behind the cloudflared tunnel,
# gated at the edge to friend tier).
#
# ## Why this file exists at all
#
# It replaces a `publish.yml` that was wrong about the shape of this app. There
# is no @wolffm/cardtable-ui package and there never will be: cardtable is a
# loopback-UI tunnel app, so the bundle it builds is the bundle its own server
# hands out. Nothing to publish; something to restart.
#
# ## Why a missing sender is worse than a broken one
#
# The receiving half already exists in hadoku_site. Nothing checks that the two
# halves pair up, and a missing sender does not error — every push goes green in
# CI while the running process keeps serving whatever was last built on disk.
# games-host sat in exactly that state undetected for its entire life, found
# only when a header rename never appeared in production. So this workflow
# failing loudly is the point, and `report-job` below is why a red run is seen.
#
# Requires HADOKU_SITE_TOKEN (seeded 2026-09-15 via hadoku_site's
# `github-secrets child-repos`; cardtable is on the additional_repos list).

name: Redeploy on hadoku_site

on:
  push:
    branches: [main]
    # A deploy is not free: mgmt-api rebuilds and `pm2 restart`s cardtable,
    # the process exits, and `host.ts`'s exit hook SIGKILLs every match JVM —
    # so every live game ends and every socket drops. On 2026-09-26 two
    # docs-only pushes (a wave plan and a retrospective) did exactly that to
    # the operator mid-match, four minutes apart: `forge:join was refused:
    # unknown-match`.
    #
    # Nothing under these paths can change what the server serves, so nothing
    # under them is worth ending a game for. This is the cheap half of the
    # fix; the durable half is making a match survive a restart at all, which
    # the client's rejoin/resync machinery is already built for.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: redeploy-cardtable
  cancel-in-progress: true

jobs:
  dispatch-redeploy:
    name: dispatch redeploy
    # See ci.yml for why there is no `||` fallback here.
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 10
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Trigger redeploy_service on hadoku_site
        env:
          TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::HADOKU_SITE_TOKEN is not set on this repository."
            echo "::error::Seed it from an up-to-date hadoku_site checkout: python3 scripts/administration.py github-secrets child-repos"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/WolffM/hadoku_site/dispatches \
            -d "$(jq -n --arg sha "${GITHUB_SHA}" \
                  '{event_type:"redeploy_service", client_payload:{service:"cardtable", sha:$sha}}')"
          echo "Dispatched redeploy_service for 'cardtable' (sha ${GITHUB_SHA})"

      # Nothing polls this repo, so a red run is seen by nobody unless it says
      # so itself. `always()` so recoveries report too — without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: cardtable:redeploy
          service-key: ${{ secrets.KEY_SERVICE_CARDTABLE }}
          started-at: ${{ env.JOB_STARTED_AT }}
