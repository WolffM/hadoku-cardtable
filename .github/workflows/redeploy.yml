# Ask hadoku_site to redeploy the `cardtable` PM2 service.
#
# Lives here, runs when CI finishes green on main (below). hadoku_site's redeploy-service.yml listens
# for `repository_dispatch: redeploy_service` and delegates to mgmt-api, which
# per its deploy-config.json does: git pull -> pnpm install && pnpm build ->
# pm2 restart cardtable (serving 127.0.0.1:9008 behind the cloudflared tunnel,
# gated at the edge to friend tier).
#
# ## Why this file exists at all
#
# It replaces a `publish.yml` that was wrong about the shape of this app. There
# is no @wolffm/cardtable-ui package and there never will be: cardtable is a
# loopback-UI tunnel app, so the bundle it builds is the bundle its own server
# hands out. Nothing to publish; something to restart.
#
# ## Why a missing sender is worse than a broken one
#
# The receiving half already exists in hadoku_site. Nothing checks that the two
# halves pair up, and a missing sender does not error — every push goes green in
# CI while the running process keeps serving whatever was last built on disk.
# games-host sat in exactly that state undetected for its entire life, found
# only when a header rename never appeared in production. So this workflow
# failing loudly is the point, and `report-job` below is why a red run is seen.
#
# Requires HADOKU_SITE_TOKEN (seeded 2026-09-15 via hadoku_site's
# `github-secrets child-repos`; cardtable is on the additional_repos list).

name: Redeploy on hadoku_site

# ## Only a green CI deploys (operator, 2026-10-03)
#
# This used to run on every push to main, in parallel with CI, so a red build
# reached production as fast as a green one. It now runs when the CI workflow
# finishes on main, and dispatches only if that run succeeded. A red CI deploys
# nothing; the next green run deploys everything that has accumulated.
#
# What gets deployed is main's head, not a chosen sha (mgmt-api pulls), so a
# green run deploys only while it is still main's head, or while everything
# after it on main is docs-only (the code pulled is then the code CI passed). A
# push in the seconds between that check and mgmt-api's pull is the remaining gap.
#
# `workflow_run` instead of a poll on push: a job waiting for CI would hold a
# runner that CI's own jobs may be queued for.
#
# ## Why docs-only changes still do not deploy
#
# A deploy is not free: mgmt-api rebuilds and `pm2 restart`s cardtable. On
# 2026-09-26 two docs-only pushes ended the operator's match four minutes
# apart, which is why this file used `paths-ignore`. `workflow_run` has no path
# filter, and comparing a green sha with its parent is wrong: CI keeps one
# pending run per group, so a code push followed by a docs push can collapse
# into one CI run on the docs commit. The `decide` job therefore diffs the green
# sha against the sha this workflow last dispatched, and deploys when anything
# outside docs/**, **/*.md and .claude/** changed in between.
#
# `workflow_dispatch` is the operator's override: it deploys main's head with
# no gate.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: redeploy-cardtable
  cancel-in-progress: true

jobs:
  decide:
    name: decide
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Anything servable changed since the last dispatch?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/$1"; }
          if [ "${EVENT}" = workflow_dispatch ]; then
            echo "manual dispatch: deploying ${GITHUB_SHA} with no gate"
            { echo deploy=true; echo "sha=${GITHUB_SHA}"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "sha=${GREEN_SHA}" >> "$GITHUB_OUTPUT"
          # mgmt-api ignores the dispatched sha and deploys main's head (hadoku_site
          # redeploy-service.yml only logs it). So a green run deploys only while its
          # sha IS main's head; if main has moved on, that newer commit's own CI run
          # decides. CI keeps the newest pending run per group, so the head always
          # gets one.
          head=$(api "commits/main" | jq -r '.sha')
          if [ "${head}" != "${GREEN_SHA}" ]; then
            # Main moved on. If everything after the green sha is docs-only, the code mgmt-api
            # would pull IS the code CI just passed, so deploy now (2026-10-06: a stream of
            # ledger and closing-note pushes starved every deploy for hours; each green run
            # found main had moved on). Anything servable after it waits for its own run.
            ahead=$(api "compare/${GREEN_SHA}...${head}")
            after=$(jq -r '.files[].filename' <<<"${ahead}" | grep -vE '^(docs/|\.claude/)|\.md$' || true)
            if [ "$(jq -r '.status' <<<"${ahead}")" != ahead ] || [ -n "${after}" ]; then
              echo "main has moved on to ${head} with servable changes; its own CI run decides"; echo deploy=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "main has moved on to ${head}, docs only after the green ${GREEN_SHA}: deploying"
          fi
          # The last sha a "dispatch redeploy" job of this workflow succeeded for.
          # Runs from before this gate (push-triggered) count: same workflow, same job name.
          last=""
          for id in $(api "actions/workflows/redeploy.yml/runs?branch=main&status=success&per_page=30" | jq -r '.workflow_runs[].id'); do
            if api "actions/runs/${id}/jobs" | jq -e '.jobs[] | select(.name == "dispatch redeploy" and .conclusion == "success")' > /dev/null; then
              last=$(api "actions/runs/${id}" | jq -r '.head_sha'); break
            fi
          done
          if [ -z "${last}" ]; then
            echo "no earlier dispatch found in the last 30 runs: deploying"; echo deploy=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          cmp=$(api "compare/${last}...${GREEN_SHA}")
          status=$(jq -r '.status' <<<"${cmp}")
          files=$(jq -r '.files | length' <<<"${cmp}")
          echo "last dispatched ${last}; green ${GREEN_SHA}; compare: ${status}, ${files} files"
          if [ "${status}" = identical ] || [ "${status}" = behind ]; then
            echo "nothing new since the last dispatch"; echo deploy=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Diverged history, or more files than the compare API lists: deploy rather than guess.
          if [ "${status}" != ahead ] || [ "${files}" -ge 300 ]; then
            echo deploy=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          servable=$(jq -r '.files[].filename' <<<"${cmp}" | grep -vE '^(docs/|\.claude/)|\.md$' || true)
          if [ -n "${servable}" ]; then
            printf 'servable changes:\n%s\n' "${servable}"; echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo "docs-only since the last dispatch: not deploying"; echo deploy=false >> "$GITHUB_OUTPUT"
          fi

  dispatch-redeploy:
    name: dispatch redeploy
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    # See ci.yml for why there is no `||` fallback here.
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 10
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Trigger redeploy_service on hadoku_site
        env:
          TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
          SHA: ${{ needs.decide.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::HADOKU_SITE_TOKEN is not set on this repository."
            echo "::error::Seed it from an up-to-date hadoku_site checkout: python3 scripts/administration.py github-secrets child-repos"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/WolffM/hadoku_site/dispatches \
            -d "$(jq -n --arg sha "${SHA}" \
                  '{event_type:"redeploy_service", client_payload:{service:"cardtable", sha:$sha}}')"
          echo "Dispatched redeploy_service for 'cardtable' (sha ${SHA})"

      # Nothing polls this repo, so a red run is seen by nobody unless it says
      # so itself. `always()` so recoveries report too — without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: cardtable:redeploy
          service-key: ${{ secrets.KEY_SERVICE_CARDTABLE }}
          started-at: ${{ env.JOB_STARTED_AT }}
