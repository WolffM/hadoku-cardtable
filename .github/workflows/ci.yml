name: CI

# DELIBERATELY UNFILTERED on pull_request — the PR-gate invariant. A required
# check that never runs never reports, and auto-merge waits only on required
# checks, so a `paths:` filter is a gate that is ABSENT on some PRs (they merge
# with nothing verified) and FATAL on others (they wait forever).
#
# `push: main` is covered too, because this repo's normal path is landing
# straight on main rather than opening a PR. A PR-only gate would leave that
# path with no CI at all.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Queue, never cancel. A cancelled `forge-e2e` leaves its e2e servers running
# on this self-hosted runner, reparented to systemd and holding the fixed e2e
# ports (2026-10-03: `14c021b`'s cancelled run kept 19008, and the next run's
# port wait failed after 10 min with no test run). GitHub keeps at most one
# PENDING run per group, so a burst of pushes still collapses to the newest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: check
    # The fleet form. `vars.CI_RUNNER` holds the label set to schedule on:
    # normally the self-hosted claws, and mgmt-api flips it to a hosted runner
    # only while every claw is offline. Hardcoding `ubuntu-latest` pinned this
    # repo onto billed minutes for no benefit.
    #
    # No `||` fallback: this repo is in hadoku_site's fleet-runner-coverage.json,
    # so the variable is always set (verified 2026-09-16: it reads
    # ["self-hosted","hadoku-builder"]). A literal default is a second copy of
    # the label set that nothing keeps in step with the first, and it only ever
    # takes effect in the one case where the fleet has deliberately said
    # otherwise.
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # The fleet's composite action, not a hand-rolled setup-node block. It
      # does setup-node (registry-url + scope) then corepack in that order —
      # load-bearing, because `corepack enable` symlinks its shims next to the
      # active node, and without setup-node first that is the host's /usr/bin.
      #
      # What it buys over the block that was here: it ASSERTS the registry
      # credential is non-empty and fails the job with a real message. An unset
      # secret reads as an EMPTY STRING, not an error, so the failure mode is a
      # bare 401 at the first `@wolffm/*` fetch — or, on a warm store, a green
      # run that authenticated with nothing. This repo hit the 401 version on
      # `2658ddf`, the commit that added its first `@wolffm/*` dependency.
      #
      # `node-version` MUST be passed: the action defaults to 22 and does not
      # read .nvmrc, which pins 24.
      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          node-version: '24'
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      # NODE_AUTH_TOKEN must be HADOKU_NPM_READ_TOKEN — never GITHUB_TOKEN and
      # never HADOKU_SITE_TOKEN:
      #
      #   GITHUB_TOKEN is scoped to this repository. `@wolffm/rooms-protocol` is
      #   a PRIVATE package owned by hadoku-watchparty, so it 403s unless this
      #   repo is added to that package's "Manage Actions access" list. The
      #   `packages: read` permission above does NOT substitute for that — it
      #   shapes the minted token, it does not grant package access.
      #
      #   HADOKU_SITE_TOKEN had its read:packages stripped in the 2026-08-19
      #   rotation, so it authenticates and then 403s on every fetch, which is
      #   harder to diagnose than an empty variable.
      #
      # The token goes on THIS step's env: only. setup-pnpm deliberately does
      # not export it, because that would make it ambient for every later step.
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # ── The image boundary: D13 as amended by D15 ────────────────────────
      #
      # NOT "no images". D13's "never host card images" clause was repealed by
      # the operator on 2026-09-15 (`docs/DECISIONS.md` D15): card art is hosted
      # on `cdn.hadoku.me`. What survived — and what this gate asserts — is that
      # **the app's own origin serves no image bytes.** We serve the app;
      # something else serves the pictures.
      #
      # The body lives in `scripts/d13-gate.sh` rather than inline here, on
      # purpose, and the reason is not theoretical. The inline version could
      # only be exercised by running the workflow, and it was wrong in TWO ways
      # that both survived review:
      #
      #   1. it treated a bare content-addressed CDN key as a forbidden
      #      relative URL, so it would have red-failed every build once a key
      #      landed in the art manifest;
      #   2. it anchored on DOUBLE QUOTES, and Vite's minifier emits these
      #      strings as template literals — `key:`<sha>.jpg`` — so it was blind
      #      to the artifact it guarded. A same-origin URL in backticks passed.
      #
      # Extraction is now delimiter-agnostic and every fixture is generated in
      # five spellings (double, single, backtick, bare CSS `url(...)`, bare
      # HTML attribute), because a fixture set that shares an assumption with
      # the extractor proves nothing about that assumption.
      #
      # `cards.scryfall.io` and `cdn.hadoku.me` appearing in the bundle are
      # CORRECT and expected: they are the two origins a card image may come
      # from. The script has the full arm-by-arm rationale.
      - name: Build the bundle
        run: pnpm --filter @hadoku/ui build

      # Two browser contexts draft one pod against the built server (e2e/).
      # Idempotent browser install: on the self-hosted runner Chromium is cached
      # in ~/.cache/ms-playwright and this is a no-op. No --with-deps (D14).
      - name: Build the server
        run: pnpm --filter @hadoku/server build

      - name: E2E — browser
        run: pnpm --filter @hadoku/e2e exec playwright install chromium

      # Every spec runs here, and the two that need Forge — `play.spec.ts`'s
      # match and `table-fit.spec.ts` — SELF-SKIP, on purpose: this job runs on
      # the fleet claws (`vars.CI_RUNNER`), and no claw has a Forge jar. Those
      # two are covered by the `forge-e2e` job below, on the one runner that
      # does. The draft e2e stays here, because it is part of the required
      # check and needs nothing but the built server.
      #
      # Wave 17 briefly set the jar variables on THIS step, assuming the job ran
      # on the host that has the jar. It does not — its runners are
      # `jit-claw-*` / `warm-claw-*` — so the "Forge is present, or fail" guard
      # did exactly its job and failed, and the image-boundary steps after it
      # were skipped. A guard that reds is the guard working; the premise was
      # what was wrong.
      - name: E2E — two friends draft one pod
        run: pnpm --filter @hadoku/e2e test

      # Runs FIRST, and deliberately. A green gate is a claim; this is the
      # demonstration. 65 throwaway fixtures under `mktemp -d`, each arm
      # asserted in both directions and every reference case in all five
      # spellings, so "the check passed" cannot mean "the check did nothing".
      # Three separate controls in this repo have passed while doing nothing,
      # including two versions of this very check.
      - name: Image boundary — prove the gate bites
        run: bash scripts/d13-gate.sh --self-test

      - name: Image boundary (D13/D15) — the CDN hosts, we do not
        run: bash scripts/d13-gate.sh apps/ui/dist

  # ── The Forge e2e: run it, and prove it RAN ─────────────────────────────────
  #
  # Until Wave 17 no CI step set `CARDTABLE_FORGE_JAR`, so `e2e/play.spec.ts`'s
  # match — the ONLY e2e that drives a real child JVM — self-skipped on every
  # run, and a skip reads as a pass. Green CI meant 3 of 4. Found in Wave 16.
  #
  # WHY HOKON, and why NOT `vars.CI_RUNNER`. The jar production runs
  # (`~/.local/share/cardtable/forge.jar`) and the vendored Forge `res/` live on
  # hokon, the production PM2 host, and nowhere else. The fleet's claws — where
  # `check` runs — have neither. So this job pins the repo-level runner by its
  # `pm2-host` label and deliberately ignores `vars.CI_RUNNER`: the fleet
  # variable says where a job CAN run, and this job can only run in one place.
  # If hokon is offline this job queues rather than going green, which is the
  # correct failure. It is not the required check; `check` is.
  #
  # LOAD AND PORTS. This runs on the production host, and it binds the e2e
  # loopback ports — 19108/19008 (draft harness, `e2e/identities.ts`) and
  # 19128/19028 (play harness, `e2e/play/harness.ts:66-67`). Any local
  # `pnpm e2e` an agent runs on hokon uses the same four ports: do not start
  # one while this job is in flight, and a red here while someone was running
  # e2e locally is a collision before it is a bug.
  #
  # Production's run directories are not touched: the harness pins the match's
  # work dir to `e2e/.run/play-work` (`PLAY_WORK_DIR`, `e2e/play/harness.ts:64`,
  # passed as `CARDTABLE_PLAY_WORK_DIR` at :149), so its boot sweep never
  # reaches production's `/tmp/cardtable-play`. No env override is needed.
  #
  # The jar variables are scoped to the two e2e steps, not the job. Job-wide
  # they would matter only if this job ran vitest — it does not. The
  # `*.jvm.test.ts` suites run in the separate `forge-jvm` job below, ordered
  # strictly after this one on the same host rather than beside it.
  #
  # Runs in parallel with `check`; the workflow-level `concurrency` group
  # queues a newer push behind both rather than cancelling them.
  forge-e2e:
    name: forge-e2e
    runs-on: [self-hosted, pm2-host]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Same as `check` — see the comments there.
      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          node-version: '24'
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Build the bundle
        run: pnpm --filter @hadoku/ui build

      - name: Build the server
        run: pnpm --filter @hadoku/server build

      - name: E2E — browser
        run: pnpm --filter @hadoku/e2e exec playwright install chromium

      # Two guards, because either alone is a check that can pass by doing
      # nothing:
      #
      #   1. Forge present, or FAIL. Mirrors `forgeAvailability()` in the
      #      harness arm for arm — a missing jar or a `res/` without
      #      `cardsfolder` would make the specs skip, so here it reds instead.
      #   2. Nothing skipped, or FAIL. Guard 1 cannot see a skip from any
      #      OTHER cause. So Playwright also writes a JSON report, and the step
      #      asserts `stats.skipped == 0` from it — reading the tool's own
      #      tally, not grepping its console. `PW_TEST_REPORTER` is Playwright's
      #      env hook for adding a reporter without touching the config
      #      (pinned 1.62.1; `playwright/lib/runner/index.js`). If an upgrade
      #      ever drops it, the report file is simply absent — and `jq` on an
      #      absent file exits non-zero, so that reds too rather than passing.
      - name: E2E — Forge is present, or fail
        env:
          CARDTABLE_FORGE_JAR: /home/hadoku/.local/share/cardtable/forge.jar
          CARDTABLE_FORGE_RES: /home/hadoku/repos/hadoku-cardtable/forge/forge-gui/res
        run: |
          test -f "$CARDTABLE_FORGE_JAR" || { echo "::error::CARDTABLE_FORGE_JAR missing: $CARDTABLE_FORGE_JAR — the Forge specs would SKIP"; exit 1; }
          test -d "$CARDTABLE_FORGE_RES/cardsfolder" || { echo "::error::CARDTABLE_FORGE_RES has no cardsfolder: $CARDTABLE_FORGE_RES — the Forge specs would SKIP"; exit 1; }

      # ONLY the Forge specs; the draft already ran in `check`. The file names
      # are appended by pnpm to the END of the package script, so they reach
      # `playwright test` (the script's last command), not `node --test`.
      # The draft harness still boots as Playwright's `webServer` — that is the
      # config's, not the spec filter's.
      #
      # The list is derived in the step below, not hand-kept here: any spec
      # that starts a real Forge stack (`forge.ok`, `startPlayStack` or
      # `startScenarioMatch`) is included automatically, so a new Forge-gated
      # spec file is covered the moment it is added instead of by a second
      # edit to a list that is easy to forget.
      # The e2e ports are fixed (`e2e/identities.ts`, `e2e/play/harness.ts`:
      # 19008/19028/19108/19128) and this runner is the operator's own host, so
      # a wave session running the same specs holds the same ports — and the
      # two runs then fail EACH OTHER in ways that read like product bugs
      # (2026-10-03: R13 red on CI, 10/10 green in the worktree). Wait for the
      # ports, up to ten minutes, and name the holder if they stay held: a
      # red that says "ports held by pid N" costs no diagnosis.
      - name: E2E — the ports are free, or wait
        run: |
          for i in $(seq 1 60); do
            held=$(ss -ltnH '( sport = :19008 or sport = :19028 or sport = :19108 or sport = :19128 )' 2>/dev/null)
            [ -z "$held" ] && { [ "$i" -gt 1 ] && echo "::notice::e2e ports came free after $((i*10)) s"; exit 0; }
            [ "$i" -eq 1 ] && echo "e2e ports held, waiting:" && echo "$held"
            sleep 10
          done
          echo "::error::e2e ports still held after 10 min — another e2e run (a wave worktree?) owns them:"
          ss -ltnp '( sport = :19008 or sport = :19028 or sport = :19108 or sport = :19128 )' || true
          exit 1

      - name: E2E — two friends play a real Forge match, and the table fits
        env:
          CARDTABLE_FORGE_JAR: /home/hadoku/.local/share/cardtable/forge.jar
          CARDTABLE_FORGE_RES: /home/hadoku/repos/hadoku-cardtable/forge/forge-gui/res
          PW_TEST_REPORTER: json
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/forge-e2e-report.json
          # Every stack's JVM run dir survives the run (see `harness.ts`), so
          # the evidence step below can send the failing one's stderr.
          CARDTABLE_E2E_WORK_DIRS_KEPT: '96'
        run: |
          # What the host looked like when the run started — the first thing a
          # flaky red needs and the one thing the log never had.
          echo "host at start: $(uptime)"; free -m | sed -n 2p
          rm -f "$PLAYWRIGHT_JSON_OUTPUT_FILE"
          # Specs held OUT of the derived list, one per line as `<file>  # <why>`.
          # Empty means every Forge-gated spec runs; an entry is a known red
          # with its reason, never a quiet way to drop a spec.
          excluded=$(cat <<'NONE'
          NONE
          )
          specs=$(grep -lE 'forge\.ok|startPlayStack|startScenarioMatch' e2e/*.spec.ts | xargs -n1 basename | sort)
          for x in $(printf '%s\n' "$excluded" | sed -E 's/#.*//'); do
            echo "::warning::$x is excluded from forge-e2e: $(printf '%s\n' "$excluded" | grep -F "$x")"
            specs=$(printf '%s\n' "$specs" | grep -vxF "$x" || true)
          done
          [ -n "$specs" ] || { echo "::error::no Forge-gated spec found — the grep matched nothing"; exit 1; }
          echo "forge-gated specs (derived):"
          echo "$specs"
          pnpm --filter @hadoku/e2e test $specs
          jq -e '.stats.skipped == 0 and .stats.unexpected == 0 and .stats.expected > 0' "$PLAYWRIGHT_JSON_OUTPUT_FILE" > /dev/null || { echo "::error::e2e report: $(jq -c .stats "$PLAYWRIGHT_JSON_OUTPUT_FILE" 2>&1) — a skipped test is not a pass"; exit 1; }

      # The evidence a red needs, kept past the job. Playwright's per-test
      # error context and the harness's per-stack server logs live under
      # `e2e/.run/`, which the NEXT run wipes — on 2026-10-03 two reds
      # (R13, T1) had nothing left to read by the time anyone looked. Text
      # only: of the JVM run dirs (`play-work/`) just the bridge's stderr and
      # the two small json files, never Forge's `res/` or `cache/`.
      - name: E2E evidence (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: forge-e2e-evidence-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          # `e2e/.run/` is a dot-directory and the action skips those by
          # default — the first upload (run 37155619558) carried only the report.
          include-hidden-files: true
          path: |
            e2e/.run/test-results/**
            e2e/.run/*.jsonl
            e2e/.run/*.json
            e2e/.run/*.log
            e2e/.run/play-logs/**
            e2e/.run/play-work/*/*/bridge.stderr.txt
            e2e/.run/play-work/*/*/jvm.json
            e2e/.run/play-work/*/*/config.json
            ${{ runner.temp }}/forge-e2e-report.json

  # ── The jar-gated suites: a real child Forge JVM per test, run serially ──
  #
  # `*.jvm.test.ts` builds a real Forge match the same way `forge-e2e` does,
  # and self-skips without `CARDTABLE_FORGE_JAR`/`CARDTABLE_FORGE_RES` (the
  # same `jvmHostConfig` check `forge-e2e` guards above). `check` runs on the
  # fleet's claws, which have no jar, so these suites always self-skipped
  # there — and a skip reads as a pass, so none of them has ever gated
  # anything before this job.
  #
  # `needs: forge-e2e` plus `if: always()` orders this job strictly AFTER
  # forge-e2e on the one host both can run on, rather than beside it: two
  # JVM-heavy suites sharing one host's CPU produce timeouts that read as
  # product bugs and are really resource contention. `if: always()` means a
  # red forge-e2e still lets this job run — one red must not hide a second —
  # not that a red here is ignored.
  #
  # `--fileParallelism=false` for the same reason inside the job: each file
  # spawns its own JVM, and vitest forking several at once would recreate the
  # exact contention the ordering above exists to avoid.
  #
  # The JSON report goes to a file and is judged by its own step, so a run
  # that dies before writing it is a red, not a silent pass.
  forge-jvm:
    name: forge-jvm
    needs: forge-e2e
    if: always()
    runs-on: [self-hosted, pm2-host]
    # The 32 suites took 1140 s (19 min) serially on this host, alone under a
    # lock (2026-10-04). ×1.5 is 28.5 min, plus checkout and install.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Same as `check` and `forge-e2e` — see the comments on `check`.
      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          node-version: '24'
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Forge is present, or every suite would SKIP
        env:
          CARDTABLE_FORGE_JAR: /home/hadoku/.local/share/cardtable/forge.jar
          CARDTABLE_FORGE_RES: /home/hadoku/repos/hadoku-cardtable/forge/forge-gui/res
        run: |
          test -f "$CARDTABLE_FORGE_JAR" || { echo "::error::CARDTABLE_FORGE_JAR missing: $CARDTABLE_FORGE_JAR — every jvm suite would SKIP"; exit 1; }
          test -d "$CARDTABLE_FORGE_RES/cardsfolder" || { echo "::error::CARDTABLE_FORGE_RES has no cardsfolder: $CARDTABLE_FORGE_RES — every jvm suite would SKIP"; exit 1; }

      # Not production's run directory: `runner.temp` is wiped per-job by the
      # runner itself, so no boot sweep logic is needed to keep this off
      # `/tmp/cardtable-play`.
      - name: Run every *.jvm.test.ts, serially
        env:
          CARDTABLE_FORGE_JAR: /home/hadoku/.local/share/cardtable/forge.jar
          CARDTABLE_FORGE_RES: /home/hadoku/repos/hadoku-cardtable/forge/forge-gui/res
          CARDTABLE_PLAY_WORK_DIR: ${{ runner.temp }}/cardtable-jvm-play
        run: |
          mkdir -p "$CARDTABLE_PLAY_WORK_DIR"
          report="${{ runner.temp }}/forge-jvm-report.json"
          rm -f "$report"
          files=$(git ls-files '*.jvm.test.ts')
          [ -n "$files" ] || { echo "::error::no *.jvm.test.ts tracked — nothing to run"; exit 1; }
          echo "jvm suites ($(printf '%s\n' "$files" | wc -l)):"
          echo "$files"
          # vitest's own exit code would red the job on a pinned failure; the
          # next step judges the report by name instead, and reds a missing one.
          pnpm exec vitest run --fileParallelism=false --reporter=default --reporter=json --outputFile="$report" $files \
            || echo "::notice::vitest exited $? — the report is judged in the next step"

      # The report is judged by name, not by count, against two pinned lists,
      # and either list going stale in EITHER direction is a red:
      #  - a skip (or todo) that is not on `expected_skips`, or one on it that
      #    no longer skips. With the jar present no `describe.skipIf` fires,
      #    so that list is empty.
      #  - a failure that is not on `known_failing`, or a pinned test that no
      #    longer fails (it passed, or is gone). So the list can only shrink:
      #    fixing a pinned test reds the job until its line is deleted.
      #  - `known_flaky` is for a measured race that passes some runs: it may
      #    pass or fail, but it must still exist. Each entry names its rate.
      # Each entry is a test's full name (`describe > it`), with a comment
      # above it giving the one-line reason and the evidence file.
      # A report that was never written is a red too, not a silent pass.
      - name: Every jvm suite ran, and nothing failed or skipped off the pinned lists
        if: always()
        run: |
          report="${{ runner.temp }}/forge-jvm-report.json"
          test -s "$report" || { echo "::error::$report is empty or missing — the jvm run did not finish writing its report"; exit 1; }
          # One full test name per line; `#` lines are the reasons, not entries.
          # `grep` exits 1 on an empty list, which the runner's pipefail would turn into a red.
          pinned() { { grep -vE '^[[:space:]]*(#|$)' || true; } | jq -R . | jq -sc 'sort'; }
          expected_skips=$(pinned <<'LIST'
          LIST
          )
          known_failing=$(pinned <<'LIST'
          # Red on main without the UI's pop-up change too: the driver never answers the coin toss. docs/planning/wave38-evidence/U-board-play-jvm-red.md
          playing by clicking the board, against a real Forge match a player plays a land and casts spells — one targeted — by clicking their own board
          # Stalls after seat 1 answers its first confirm, every run, on main too. docs/planning/wave38-evidence/U-prompts-jvm-red.md
          the fifteen prompts against a real Forge match choices: confirm, order, tempShowZones, getChoices, showInputDialog, chooseSingleEntityForEffect
          # Asserts Forge re-asks one ability twice; the server now answers the re-ask itself (c75060d), so it never repeats. docs/planning/wave38-evidence/U-flow-jvm-red.md
          wave 20 lane B: turns that flow, against a real Forge match Forge offers the same one ability twice for one click, and the player sees neither
          LIST
          )
          known_flaky=$(pinned <<'LIST'
          # Seat 1's card lookup races the reveal's decode: 'card #47' instead of 'Forest (47)', red and green on main. docs/planning/wave38-evidence/U-prompts-jvm-red.md
          the fifteen prompts against a real Forge match a reveal: the label carries Forge's "(id)", and the card's own facts are in the browser anyway
          # The block input opens and closes with nobody pressing, 3 of 4 runs. docs/planning/wave38-evidence/J-blockers.md
          Declare Blockers, set up by a scenario, against real Forge Q12: a defender with one creature is NOT auto-passed through Declare Blockers, and can assign the block
          LIST
          )
          jq -e --argjson skips "$expected_skips" --argjson failing "$known_failing" --argjson flaky "$known_flaky" '
            [.testResults[].assertionResults[]] as $all
            | ([$all[] | select(.status == "failed") | .fullName] | sort - $flaky) as $failed
            | ([$all[] | select(.status != "passed" and .status != "failed") | .fullName] | sort) as $skipped
            | {
                "failed, not pinned": ($failed - $failing),
                "pinned as failing, did not fail": ($failing - $failed),
                "skipped, not pinned": ($skipped - $skips),
                "pinned as skipped, did not skip": ($skips - $skipped),
                "no tests at all": (if ($all | length) == 0 then ["the report holds no test"] else [] end)
              }
            | . + {"pinned as flaky, not in the report": ($flaky - [$all[].fullName])}
            | with_entries(select(.value | length > 0))
            | if length == 0 then true else (., false) end
          ' "$report" || { echo "::error::the jvm report does not match the pinned lists (see the object above)"; exit 1; }
