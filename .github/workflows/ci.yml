name: CI

# DELIBERATELY UNFILTERED on pull_request — the PR-gate invariant. A required
# check that never runs never reports, and auto-merge waits only on required
# checks, so a `paths:` filter is a gate that is ABSENT on some PRs (they merge
# with nothing verified) and FATAL on others (they wait forever).
#
# `push: main` is covered too, because this repo's normal path is landing
# straight on main rather than opening a PR. A PR-only gate would leave that
# path with no CI at all.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: check
    # The fleet form: CI_RUNNER is normally unset, which means the self-hosted
    # claws. mgmt-api sets it to a hosted runner only while every claw is
    # offline. Hardcoding ubuntu-latest pinned this repo onto billed minutes
    # for no benefit.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","hadoku-builder"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # The fleet's composite action, not a hand-rolled setup-node block. It
      # does setup-node (registry-url + scope) then corepack in that order —
      # load-bearing, because `corepack enable` symlinks its shims next to the
      # active node, and without setup-node first that is the host's /usr/bin.
      #
      # What it buys over the block that was here: it ASSERTS the registry
      # credential is non-empty and fails the job with a real message. An unset
      # secret reads as an EMPTY STRING, not an error, so the failure mode is a
      # bare 401 at the first `@wolffm/*` fetch — or, on a warm store, a green
      # run that authenticated with nothing. This repo hit the 401 version on
      # `2658ddf`, the commit that added its first `@wolffm/*` dependency.
      #
      # `node-version` MUST be passed: the action defaults to 22 and does not
      # read .nvmrc, which pins 24.
      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          node-version: '24'
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      # NODE_AUTH_TOKEN must be HADOKU_NPM_READ_TOKEN — never GITHUB_TOKEN and
      # never HADOKU_SITE_TOKEN:
      #
      #   GITHUB_TOKEN is scoped to this repository. `@wolffm/rooms-protocol` is
      #   a PRIVATE package owned by hadoku-watchparty, so it 403s unless this
      #   repo is added to that package's "Manage Actions access" list. The
      #   `packages: read` permission above does NOT substitute for that — it
      #   shapes the minted token, it does not grant package access.
      #
      #   HADOKU_SITE_TOKEN had its read:packages stripped in the 2026-08-19
      #   rotation, so it authenticates and then 403s on every fetch, which is
      #   harder to diagnose than an empty variable.
      #
      # The token goes on THIS step's env: only. setup-pnpm deliberately does
      # not export it, because that would make it ambient for every later step.
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # The bundle is what actually reaches a browser, so D13 — never commit,
      # host, mirror, cache or proxy a card image — is checked against the
      # ARTIFACT, not only the source. `pool.json` is inlined into it here.
      #
      # This runs on every push rather than only on a release: the loopback
      # server hands out `apps/ui/dist` straight off disk, so a bundle that
      # reached main is a bundle that reaches production on the next redeploy.
      #
      # It greps FIELD NAMES and URL SHAPES, never free text. A first cut
      # scanned text and fired immediately on `Mirror Image`, `Phantasmal
      # Image` and `Nissa's Pilgrimage` — "image" is a substring of real card
      # names, and a control that cries wolf on legitimate data gets switched
      # off, which is worse than not having one.
      - name: Build the bundle
        run: pnpm --filter @hadoku/ui build

      - name: D13 — no card images in the built bundle
        run: |
          set -euo pipefail
          dist=apps/ui/dist
          if grep -rIlE 'https?://[^"]*(\.(jpe?g|png|webp|gif)|scryfall\.io)' "$dist"; then
            echo "::error::D13 violation — the bundle carries an image URL."
            exit 1
          fi
          if grep -rIlE '"image_uris"|"image_status"|"art_crop"' "$dist"; then
            echo "::error::D13 violation — the bundle carries a Scryfall image field."
            exit 1
          fi
          echo "D13: no image URL and no image field in $dist"
