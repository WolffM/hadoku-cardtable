# Publish `@wolffm/cardtable-ui` to GitHub Packages, then tell hadoku_site.
#
# ## Why this is `publish.yml` and not `deploy.yml`
#
# Nothing in this repo deploys itself. A child UI app reaches production by
# PUBLISHING a package that hadoku_site consumes and mounts at its route — so
# the deploy half lives over there, triggered by the `packages_updated`
# dispatch at the end of this file. Modelled on `hadoku-craft/.github/
# workflows/publish.yml`, which is the closest analogue: a UI package with no
# service behind it.
#
# `hadoku-watchparty/.github/workflows/deploy.yml` is the OTHER shape — it
# dispatches `redeploy_service` because watchparty has a PM2 socket server to
# restart. cardtable has no server yet (`apps/server/` is an empty `.gitkeep`),
# so it is the craft shape today. **If cardtable becomes a tunnel app instead**
# — see `docs/requests/HADOKU_SITE_PROD_ONBOARDING.md` §3, which is a live
# question for hadoku_site — this file is what changes.
#
# ## Blocked until `apps/ui` is a publishable package
#
# `apps/ui` is currently `"private": true` with no `main`/`types`/`files` and a
# Vite *app* build, not a library build. This workflow is committed ahead of
# that deliberately, so the shape is reviewable while the packaging question is
# still open — it is gated on `PUBLISHABLE` below and is a no-op until that is
# flipped. It will not silently half-publish something.

name: Publish cardtable-ui

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Gate: flip to 'true' in the same commit that makes apps/ui a library
      # build. Until then this job exits successfully having done nothing,
      # which is the honest state — the alternative is a red main for a
      # packaging step nobody has written yet.
      - name: Is the UI publishable yet?
        id: gate
        run: |
          PUBLISHABLE=false
          echo "publishable=$PUBLISHABLE" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHABLE" != "true" ]; then
            echo "apps/ui is not a publishable package yet — skipping."
            echo "See docs/requests/HADOKU_SITE_PROD_ONBOARDING.md §2."
          fi

      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        if: steps.gate.outputs.publishable == 'true'
        with:
          node-version: '24' # match .nvmrc; the action defaults to 22
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install
        if: steps.gate.outputs.publishable == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      # The gate runs before the build, not after: publishing a bundle that
      # fails typecheck or leaks a card image is worse than not publishing.
      - name: Check
        if: steps.gate.outputs.publishable == 'true'
        run: pnpm check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Build
        if: steps.gate.outputs.publishable == 'true'
        run: pnpm --filter @wolffm/cardtable-ui build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      # D13 is a release gate, not just a test. The bundle is what actually
      # reaches a browser, so it is what gets checked: no image field, no image
      # URL, no Scryfall image host. `pool.json` is inlined into it, and the
      # build-pool CLI applies the same rule at generation time — this is the
      # second of the two, because the one that matters is the artifact.
      - name: D13 — no card images in the published bundle
        if: steps.gate.outputs.publishable == 'true'
        run: |
          set -euo pipefail
          dist=apps/ui/dist
          if grep -rIlE 'https?://[^"]*(\.(jpe?g|png|webp|gif)|scryfall\.io)' "$dist" ; then
            echo "::error::D13 violation — the bundle carries an image URL."
            exit 1
          fi
          if grep -rIlE '"image_uris"|"image_status"|"art_crop"' "$dist" ; then
            echo "::error::D13 violation — the bundle carries a Scryfall image field."
            exit 1
          fi
          echo "D13: no image URL and no image field in $dist"

      - name: Bump version if this one is already published
        if: steps.gate.outputs.publishable == 'true'
        working-directory: apps/ui
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — bumping patch."
            npm version patch --no-git-tag-version
          else
            echo "$name@$version is not published yet."
          fi
        env:
          # The version WALK is a cross-repo read, which GITHUB_TOKEN cannot do.
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Publish
        if: steps.gate.outputs.publishable == 'true'
        working-directory: apps/ui
        run: pnpm publish --no-git-checks
        env:
          # Publishing this repo's OWN package uses the repo-local
          # GITHUB_TOKEN (see `permissions: packages: write` above) — NOT a PAT.
          # HADOKU_SITE_TOKEN was rotated to minimal scopes on 2026-08-14 and no
          # longer carries write:packages; publishing on it 403s with "the token
          # provided does not match expected scopes". Reads still need the PAT.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tell hadoku_site a new package is available
        if: steps.gate.outputs.publishable == 'true'
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HADOKU_SITE_TOKEN}" ]; then
            echo "::error::HADOKU_SITE_TOKEN is not set on this repository."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://api.github.com/repos/WolffM/hadoku_site/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${HADOKU_SITE_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"event_type":"packages_updated","client_payload":{"package":"@wolffm/cardtable-ui","repo":"hadoku-cardtable","sha":"${{ github.sha }}"}}')
          if [ "$status" = "204" ]; then
            echo "Notified hadoku_site."
          else
            echo "::error::hadoku_site dispatch failed (HTTP $status)"
            exit 1
          fi
