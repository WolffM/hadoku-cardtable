packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# `forge/` is a vendored Java tree (gitignored until WolffM/forge exists) and is
# NOT a JS workspace member. The globs above deliberately do not reach it.

# Packages permitted to run install/build scripts. pnpm 11 blocks lifecycle
# scripts by default and writes this map. esbuild needs its platform binary
# fetched — vite/vitest cannot run without it.
allowBuilds:
  esbuild: true

# Supply-chain: external packages must be 7 days old before they resolve.
# Malicious npm releases are near-always caught within hours (Shai-Hulud ~12h,
# debug/chalk ~2.5h), so we let the ecosystem find them first. Carried over from
# hadoku-watchparty. Our own packages are EXEMPT (verified): they are the
# cross-ecosystem deploy path and must install immediately — gating them would
# stall package sync. They are imported as @wolffm/* but installed from npmjs as
# @hadoku/* (`"@wolffm/x": "npm:@hadoku/x@<ver>"`), and pnpm judges an alias by
# its REAL name, so it is @hadoku/* that must be exempt (hadoku_site
# docs/operations/NPMJS_PUBLISHING.md).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@hadoku/*'
