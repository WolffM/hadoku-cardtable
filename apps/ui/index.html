<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Replaced with the catalogue's name for this app at build time, so the
         tab and the header stay one name. See app-name.ts. -->
    <title>__HADOKU_APP_NAME__</title>
    <!--
      The site's own mark, served by hadoku.me at the ROOT — deliberately not
      under /cardtable/, which only this server answers. Every hadoku app links
      the same one. Without it the browser asks for /favicon.ico, which 404s.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
