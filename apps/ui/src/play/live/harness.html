<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cardtable — live board</title>
    <!--
      A dev-only entry point for the LIVE board, served by `vite` at
      /cardtable/src/play/live/harness.html. Not a build input (vite.config.ts

    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./harness.tsx"></script>
