<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CheerpJ x Forge -- wave 14 lane B spike</title>
<style>
  body { font: 13px/1.5 ui-monospace, monospace; margin: 0; background: #111; color: #ddd; }
  #log { white-space: pre-wrap; padding: 8px; max-height: 40vh; overflow: auto; border-bottom: 1px solid #333; }
</style>
</head>
<body>
<div id="log">booting...</div>
<div id="display"></div>
<script>
// ---------------------------------------------------------------------------
// Every line CheerpJ's Java System.out/System.err produces arrives here as a
// console.log. We hook console BEFORE loader.js is fetched so no line is lost,
// and stamp each with performance.now() -- so every latency in this spike is
// measured in ONE clock (the browser's) and there is no JVM/JS correlation to
// get wrong.
// ---------------------------------------------------------------------------
const S = window.__spike = {
  probe: new URLSearchParams(location.search).get('probe') || 'net',
  lines: [],          // { t, s }
  marks: {},          // name -> performance.now()
  error: null,
  finished: false,
};
const mark = (n) => { S.marks[n] = performance.now(); };
const logEl = document.getElementById('log');

for (const m of ['log', 'warn', 'error', 'info']) {
  const orig = console[m].bind(console);
  console[m] = (...a) => {
    const s = a.map(x => (typeof x === 'string' ? x : String(x))).join(' ');
    S.lines.push({ t: performance.now(), s });
    logEl.textContent += '\n' + s;
    logEl.scrollTop = logEl.scrollHeight;
    orig(...a);
  };
}
window.addEventListener('error', e => { S.error = String(e.message || e.error); });
window.addEventListener('unhandledrejection', e => { S.error = String(e.reason); });

// find the performance.now() of the first console line matching a prefix
S.find = (prefix) => (S.lines.find(l => l.s.startsWith(prefix)) || null);

mark('pageStart');
</script>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<script>
(async () => {
  try {
    mark('loaderReady');
    // No tailscale* options are passed on purpose: this spike does NOT stand up
    // a Tailscale/Headscale control plane, and the point of NetProbe is to see
    // what java.nio does WITHOUT one. See docs/spikes/cheerpj.md.
    // version: 17 is REQUIRED. CheerpJ defaults to Java 8 mode and then refuses
    // any class file above major 52 with:
    //   "Required Java version 17, but CheerpJ is currently in Java 8 mode."
    // Forge is built at --release 17 (forge/pom.xml:27), so this is not optional.
    // user.dir: Forge resolves its assets relative to the process working
    // directory (GuiDesktop.getAssetsDir() returns "" for a non-"git" version
    // string, forge-gui-desktop/src/main/java/forge/GuiDesktop.java:89-92), and
    // CheerpJ's default cwd is /files/. Pointing it at /app/ lets Forge find a
    // res/ tree served next to the jar.
    const init = { version: 17, enableDebug: false, javaProperties: ['user.dir=/app/'] };

    // ── The natives probe (Wave 14 lane B's one unverified dependency) ──────
    //
    // CheerpJ binds a Java `native` method to a JS function named
    // Java_<pkg>_<Class>_<method>. The signature CheerpJ passes is
    // (lib, ...args) for a STATIC native — `lib` is the handle, not an
    // argument — and getting that wrong looks exactly like "natives are
    // broken", so each implementation logs what it actually received.
    //
    // These are declared `async` ON PURPOSE. That is the question: whether
    // CheerpJ suspends the Java thread across a JS await. Forge's
    // IToServer.send() is synchronous and a browser WebSocket is not, so if
    // this does not hold, lane B's cost estimate is wrong by a rewrite.
    if (S.probe === 'natives') {
      const enc = (arr) => Array.from(arr, b => (b & 0xff).toString(16).padStart(2, '0')).join('');
      init.natives = {
        async Java_spike_NativesProbe_ping(lib, str) {
          console.log('NATIVES-JS ping argc=' + arguments.length + ' arg=' + String(str));
          return 'pong:' + String(str);
        },
        async Java_spike_NativesProbe_echoBytes(lib, bytes) {
          console.log('NATIVES-JS echoBytes len=' + (bytes && bytes.length) + ' hex=' + enc(bytes || []));
          return bytes;
        },
        // Does a native have to return the array it was given? A transport's
        // replies are not the size of its requests, so if the answer is yes,
        // the shape of the bridge changes (two calls: length, then fetch).
        async Java_spike_NativesProbe_growBytes(lib, bytes) {
          const out = new Uint8Array(bytes.length * 2);
          out.set(bytes, 0);
          out.set(bytes, bytes.length);
          console.log('NATIVES-JS growBytes in=' + bytes.length + ' out=' + out.length);
          return out;
        },
        async Java_spike_NativesProbe_wsRoundTrip(lib, url, bytes) {
          const u = String(url);
          console.log('NATIVES-JS wsRoundTrip url=' + u + ' len=' + (bytes && bytes.length));
          // A deliberate delay BEFORE the socket work, so a pass cannot be a
          // synchronous stub resolving instantly: the Java side prints the
          // elapsed time and it must exceed this.
          await new Promise(r => setTimeout(r, 150));
          const out = await new Promise((resolve, reject) => {
            const ws = new WebSocket(u);
            ws.binaryType = 'arraybuffer';
            const t = setTimeout(() => { try { ws.close(); } catch {} reject(new Error('ws timeout')); }, 10000);
            ws.onerror = (e) => { clearTimeout(t); reject(new Error('ws error')); };
            ws.onopen = () => ws.send(new Uint8Array(bytes));
            ws.onmessage = (ev) => {
              clearTimeout(t);
              const got = new Uint8Array(ev.data);
              try { ws.close(); } catch {}
              resolve(got);
            };
          });
          console.log('NATIVES-JS wsRoundTrip got len=' + out.length + ' hex=' + enc(out));
          // A freshly constructed Uint8Array threw ArrayIndexOutOfBoundsException
          // on the Java side (measured), while echoBytes returning the array
          // CheerpJ handed IN worked. So copy into the caller's array and return
          // that object: this distinguishes "natives cannot carry a payload back"
          // from "the return must be an array CheerpJ minted", and only the
          // second is survivable.
          if (out.length !== bytes.length) {
            console.log('NATIVES-JS wsRoundTrip LENGTH MISMATCH in=' + bytes.length + ' out=' + out.length);
            return bytes;
          }
          for (let i = 0; i < out.length; i++) bytes[i] = out[i];
          return bytes;
        },
      };
    }
    if (new URLSearchParams(location.search).get('tailscale') === '1') {
      // Deliberately a DEAD control plane on this same origin, and an obviously
      // fake key. The question is not "can we join a tailnet" -- it is whether
      // CheerpJ installs the sun.nio.ch.Net natives when ANY tailscale* option is
      // present, i.e. whether the UnsatisfiedLinkError the no-Tailscale run hits
      // is "not configured" or "not implemented". No real key is ever used, and
      // nothing is sent to login.tailscale.com.
      init.tailscaleControlUrl = location.origin + '/no-such-control-plane/';
      init.tailscaleAuthKey = 'tskey-auth-NOT-A-REAL-KEY';
    }
    await cheerpjInit(init);
    mark('initDone');

    cheerpjCreateDisplay(800, 600, document.getElementById('display'));
    mark('displayDone');

    if (S.probe === 'forgejar') {
      // Forge desktop's own entry point, straight off the shipped fat jar.
      await cheerpjRunJar('/app/forge.jar');
    } else {
      const cls = { swing: 'spike.SwingProbe', fs: 'spike.FsProbe', natives: 'spike.NativesProbe' }[S.probe] || 'spike.NetProbe';
      // NetProbe's argv[0] is this page's own origin, so it can try same-origin
      // HTTP and a raw TCP connect to the SAME host:port and compare the two
      // failures. FsProbe's argv[0] is a path to look for under /app/.
      const argv = {
        fs: ['res/skins/default/bg_splash.png'],
        swing: [],
        natives: [location.origin.replace(/^http/, 'ws') + '/echo'],
      }[S.probe] || [location.origin];
      await cheerpjRunMain(cls, '/app/probe.jar:/app/forge.jar', ...argv);
    }
    mark('runReturned');
  } catch (e) {
    S.error = (e && e.stack) ? e.stack : String(e);
    console.error('SPIKE-HARNESS-ERROR ' + S.error);
  } finally {
    S.finished = true;
    mark('finished');
  }
})();
</script>
</body>
</html>
